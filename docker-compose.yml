services:
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_ATLAS_CONNECTION: mongodb://mongodb:27017/todoapp
      PORT: 5000
    depends_on:
      - mongodb
    command: sh -c "while ! nc -z mongodb 27017; do echo 'waiting for mongodb...'; sleep 2; done; npm start"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://backend:5000/api
    depends_on:
      - backend
    command: sh -c "while ! nc -z backend 5000; do echo 'waiting for backend...'; sleep 2; done; nginx -g 'daemon off;'"

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    ports:
      - "82:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    restart: unless-stopped

volumes:
  mongodb_data:
  jenkins_home:
