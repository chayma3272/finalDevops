services:
  # 1. Service de Base de Données (MongoDB)
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      # Expose le port 27017 en interne pour le backend
      - "27017:27017"
    volumes:
      # Stocke les données de la base de données dans un volume persistant
      - mongodb_data:/data/db
    # Variables d'environnement pour la base de données (si besoin, ici on utilise les valeurs par défaut)
    environment:
      MONGO_INITDB_DATABASE: todoapp # Nom de la base de données

  # 2. Service Backend (Node.js/Express)
  backend:
    build:
      context: ./server # Indique où trouver le Dockerfile (dans le dossier server)
      dockerfile: Dockerfile
    container_name: backend
    ports:
      # Expose le port 5000 en interne pour le frontend
      - "5000:5000"
    environment:
      # L'URL de connexion à la base de données (utilise le nom du service 'mongodb')
      MONGODB_ATLAS_CONNECTION: mongodb://mongodb:27017/todoapp
      PORT: 5000
    depends_on:
      - mongodb # Assure que la base de données démarre avant le backend

  # 3. Service Frontend (React/Nginx)
  frontend:
    build:
      context: ./client # Indique où trouver le Dockerfile (dans le dossier client)
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      # Expose le port 80 (Nginx) sur le port 8080 de votre machine hôte
      - "8080:80"
    depends_on:
      - backend # Assure que le backend démarre avant le frontend

# Volumes pour la persistance des données MongoDB
volumes:
  mongodb_data:
